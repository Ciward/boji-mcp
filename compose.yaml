services:
  boji:
    build: .
    restart: unless-stopped
    ports:
      - '${BOJI_BIND_ADDRESS:-127.0.0.1}:${BOJI_BIND_PORT:-8787}:8787'
    env_file: ${BOJI_ENV_FILE:-.env}
    environment:
      BOJI_HOST: 0.0.0.0
      BOJI_PORT: 8787
      BOJI_DATA_DIR: /data
    volumes:
      - '${BOJI_DATA_PATH:-./data}:/data'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
