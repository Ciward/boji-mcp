name: Build Boji image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux amd64 image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "boji:$GITHUB_SHA" .
      - name: Verify first startup with an empty volume
        run: |
          set -eu
          docker run -d --name smoke --volume /data --read-only --tmpfs /tmp -e "BOJI_ADMIN_PASSWORD=$(openssl rand -hex 32)" -p 127.0.0.1:18787:8787 "boji:$GITHUB_SHA"
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18787/healthz
          curl -fsS http://127.0.0.1:18787/.well-known/oauth-authorization-server
      - name: Export revision-tagged image
        run: docker save "boji:$GITHUB_SHA" | gzip -1 > boji-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: boji-linux-amd64
          path: boji-linux-amd64.tar.gz
          retention-days: 7
